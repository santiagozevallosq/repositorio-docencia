<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Notas Universitarias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <!-- Botón superior Volver al Repositorio -->
  <div class="max-w-4xl mx-auto px-4 pt-4 flex justify-between items-center">
    <a href="../../../index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition text-xs font-semibold shadow-xs">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Repositorio Docente
    </a>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;


function App() {
  // Estados para las notas de entrada
  const [practica, setPractica] = useState('14');
  const [parcial, setParcial] = useState('12');
  const [examenFinal, setExamenFinal] = useState('11');
  const [participacion, setParticipacion] = useState('15');
  
  // Nota mínima para aprobar (configurable, por defecto 10.5 en la mayoría de universidades de Perú/Latam que redondea a 11)
  const [notaAprobatoria, setNotaAprobatoria] = useState(10.5);

  // Estados de error para validaciones individuales
  const [errores, setErrores] = useState({
    practica: '',
    parcial: '',
    examenFinal: '',
    participacion: ''
  });

  // Pesos definidos por el usuario
  const pesos = {
    practica: 0.20,
    parcial: 0.30,
    examenFinal: 0.40,
    participacion: 0.10
  };

  // Función de validación individual de notas
  const validarNota = (valor, campo) => {
    if (valor === '') {
      return 'Este campo no puede estar vacío';
    }
    const num = parseFloat(valor);
    if (isNaN(num)) {
      return 'Debe ser un número válido';
    }
    if (num < 0 || num > 20) {
      return 'La nota debe estar entre 0.0 y 20.0';
    }
    return '';
  };

  // Manejadores de cambios con validación instantánea
  const handleInputChange = (val, setFunc, campo) => {
    // Permitir solo números y un punto decimal
    const cleanVal = val.replace(/[^0-9.]/g, '');
    
    // Evitar múltiples puntos decimales
    const parts = cleanVal.split('.');
    if (parts.length > 2) return;

    setFunc(cleanVal);

    const errorMsg = validarNota(cleanVal, campo);
    setErrores(prev => ({ ...prev, [campo]: errorMsg }));
  };

  // Incremento / Decremento rápido de notas (botoncitos + y - para facilitar en móviles)
  const ajustarNota = (valorActual, setFunc, campo, incremento) => {
    const actual = parseFloat(valorActual) || 0;
    let nuevo = Math.round((actual + incremento) * 10) / 10;
    if (nuevo < 0) nuevo = 0;
    if (nuevo > 20) nuevo = 20;
    
    const nuevoStr = nuevo.toString();
    setFunc(nuevoStr);
    const errorMsg = validarNota(nuevoStr, campo);
    setErrores(prev => ({ ...prev, [campo]: errorMsg }));
  };

  // Cálculos reactivos basados en el estado
  const nPractica = parseFloat(practica) || 0;
  const nParcial = parseFloat(parcial) || 0;
  const nFinal = parseFloat(examenFinal) || 0;
  const nParticipacion = parseFloat(participacion) || 0;

  // Verificar si hay errores activos en el formulario
  const tieneErrores = Object.values(errores).some(err => err !== '') || 
                       practica === '' || parcial === '' || examenFinal === '' || participacion === '';

  // Calcular promedio ponderado
  const promedioFinal = tieneErrores ? 0 : 
    (nPractica * pesos.practica) + 
    (nParcial * pesos.parcial) + 
    (nFinal * pesos.examenFinal) + 
    (nParticipacion * pesos.participacion);

  const promedioRedondeado = Math.round(promedioFinal * 100) / 100;
  const aprobado = promedioRedondeado >= notaAprobatoria;

  // Calculador predictivo: ¿Cuánto necesito en el examen final para aprobar?
  // Formula: NotaAprobatoria = (Practica * 0.2) + (Parcial * 0.3) + (X * 0.4) + (Participacion * 0.1)
  // X = (NotaAprobatoria - (Practica * 0.2 + Parcial * 0.3 + Participacion * 0.1)) / 0.4
  const acumuladoSinFinal = (nPractica * pesos.practica) + (nParcial * pesos.parcial) + (nParticipacion * pesos.participacion);
  const notaFinalNecesaria = (notaAprobatoria - acumuladoSinFinal) / pesos.examenFinal;
  const notaFinalNecesariaRedondeada = Math.max(0, Math.round(notaFinalNecesaria * 10) / 10);

  // Mensaje y recomendación personalizada según rendimiento académico
  let recomendacion = {
    titulo: '¡Sigue adelante!',
    texto: 'Completa todas las notas para ver tu diagnóstico académico personalizado.',
    color: 'text-slate-500 bg-slate-100',
    emoji: '📝'
  };

  if (!tieneErrores) {
    if (promedioRedondeado >= 18) {
      recomendacion = {
        titulo: '¡Rendimiento Excepcional!',
        texto: '¡Felicidades! Estás en el nivel de excelencia académica (Suma Cum Laude). Sigue manteniendo ese increíble ritmo, eres un ejemplo.',
        color: 'text-emerald-700 bg-emerald-50 border-emerald-200',
        emoji: '👑'
      };
    } else if (promedioRedondeado >= 15) {
      recomendacion = {
        titulo: '¡Muy Buen Trabajo!',
        texto: 'Tienes un promedio bastante sólido. Continúa participando activamente y repasando diariamente para asegurar tu lugar en el tercio superior.',
        color: 'text-teal-700 bg-teal-50 border-teal-200',
        emoji: '🌟'
      };
    } else if (promedioRedondeado >= notaAprobatoria) {
      recomendacion = {
        titulo: '¡Aprobado con Éxito!',
        texto: 'Estás dentro del rango seguro de aprobación, pero no te confíes. Un pequeño esfuerzo extra en tus próximos parciales y asegurarás una excelente nota final.',
        color: 'text-indigo-700 bg-indigo-50 border-indigo-200',
        emoji: '✅'
      };
    } else if (promedioRedondeado >= 8) {
      recomendacion = {
        titulo: '¡Alerta Académica!',
        texto: `Actualmente te encuentras desaprobado. ¡Aún estás a tiempo de salvar el ciclo! Enfócate en mejorar tus hábitos de estudio y organiza grupos de apoyo académico.`,
        color: 'text-amber-700 bg-amber-50 border-amber-200',
        emoji: '⚠️'
      };
    } else {
      recomendacion = {
        titulo: '¡Zona Crítica!',
        texto: 'Tu promedio está muy por debajo del mínimo requerido. Te sugerimos conversar urgentemente con tu docente, solicitar tutorías universitarias y reestructurar tu plan de estudio de inmediato.',
        color: 'text-rose-700 bg-rose-50 border-rose-200',
        emoji: '🚨'
      };
    }
  }

  return (
    <div className="min-h-screen bg-slate-900 text-slate-100 font-sans selection:bg-violet-500 selection:text-white pb-12">
      {/* Header / Banner Principal */}
      <header className="relative overflow-hidden bg-gradient-to-r from-violet-600 via-indigo-700 to-blue-800 py-10 px-4 shadow-xl">
        {/* Decoraciones de fondo */}
        <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
        <div className="absolute -top-10 -right-10 w-40 h-40 bg-pink-500 rounded-full filter blur-3xl opacity-30"></div>
        <div className="absolute -bottom-10 -left-10 w-40 h-40 bg-emerald-400 rounded-full filter blur-3xl opacity-20"></div>

        <div className="max-w-5xl mx-auto relative z-10 flex flex-col md:flex-row justify-between items-center gap-6">
          <div className="text-center md:text-left">
            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-violet-500/30 text-violet-200 border border-violet-400/20 mb-3">
              🚀 Portal de Herramientas Estudiantiles
            </span>
            <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">
              Calculadora de Nota Final
            </h1>
            <p className="text-indigo-100 text-sm md:text-base max-w-xl">
              Diseñada especialmente para estudiantes universitarios. Calcula tu promedio ponderado al instante, proyecta tus notas y asegura el ciclo.
            </p>
          </div>
          
          {/* Selector de Nota Mínima Aprobatoria */}
          <div className="bg-slate-900/60 backdrop-blur-md border border-slate-700 p-4 rounded-2xl w-full sm:w-auto flex items-center justify-between gap-4">
            <div>
              <div className="text-xs text-slate-400 uppercase font-bold tracking-wider">Nota Aprobatoria</div>
              <div className="text-xs text-indigo-300 mt-0.5">Configuración de tu universidad</div>
            </div>
            <div className="flex items-center gap-2 bg-slate-850 p-1.5 rounded-xl border border-slate-700">
              <button 
                onClick={() => setNotaAprobatoria(10.5)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${notaAprobatoria === 10.5 ? 'bg-violet-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
              >
                10.5 (11)
              </button>
              <button 
                onClick={() => setNotaAprobatoria(11.0)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${notaAprobatoria === 11.0 ? 'bg-violet-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
              >
                11.0
              </button>
              <button 
                onClick={() => setNotaAprobatoria(12.0)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${notaAprobatoria === 12.0 ? 'bg-violet-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
              >
                12.0
              </button>
            </div>
          </div>
        </div>
      </header>

      {/* Contenido Principal */}
      <main className="max-w-5xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        {/* COLUMNA IZQUIERDA: Formulario de Notas */}
        <section className="lg:col-span-7 flex flex-col gap-6">
          <div className="bg-slate-800/90 backdrop-blur border border-slate-700 p-6 rounded-3xl shadow-xl">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-xl font-bold text-white flex items-center gap-2">
                <span className="text-2xl">📋</span> Registro de Notas
              </h2>
              <span className="text-xs text-indigo-400 font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20">
                Escala de 0 a 20
              </span>
            </div>

            {/* Inputs de Notas */}
            <div className="space-y-5">
              
              {/* Nota de Práctica (20%) */}
              <div className="p-4 rounded-2xl bg-slate-900/40 border border-slate-700/60 transition-all hover:border-violet-500/50">
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-violet-500"></span>
                    Nota de Práctica (Evaluación Continua)
                  </label>
                  <span className="text-xs font-extrabold text-violet-400 bg-violet-500/10 px-2 py-0.5 rounded-md border border-violet-500/20">
                    Peso: 20%
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <button 
                    type="button"
                    onClick={() => ajustarNota(practica, setPractica, 'practica', -1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    -
                  </button>
                  <div className="relative flex-1">
                    <input 
                      type="text" 
                      value={practica}
                      onChange={(e) => handleInputChange(e.target.value, setPractica, 'practica')}
                      placeholder="0.0"
                      className={`w-full text-center py-2 px-3 bg-slate-900 border ${errores.practica ? 'border-rose-500 focus:ring-rose-500/20' : 'border-slate-700 focus:ring-violet-500/20 focus:border-violet-500'} rounded-xl font-bold text-lg text-white focus:outline-none focus:ring-4 transition-all`}
                    />
                  </div>
                  <button 
                    type="button"
                    onClick={() => ajustarNota(practica, setPractica, 'practica', 1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    +
                  </button>
                </div>
                {errores.practica && (
                  <p className="text-xs text-rose-400 mt-1.5 flex items-center gap-1">⚠️ {errores.practica}</p>
                )}
              </div>

              {/* Nota Examen Parcial (30%) */}
              <div className="p-4 rounded-2xl bg-slate-900/40 border border-slate-700/60 transition-all hover:border-blue-500/50">
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                    Nota Examen Parcial
                  </label>
                  <span className="text-xs font-extrabold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-md border border-blue-500/20">
                    Peso: 30%
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <button 
                    type="button"
                    onClick={() => ajustarNota(parcial, setParcial, 'parcial', -1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    -
                  </button>
                  <div className="relative flex-1">
                    <input 
                      type="text" 
                      value={parcial}
                      onChange={(e) => handleInputChange(e.target.value, setParcial, 'parcial')}
                      placeholder="0.0"
                      className={`w-full text-center py-2 px-3 bg-slate-900 border ${errores.parcial ? 'border-rose-500 focus:ring-rose-500/20' : 'border-slate-700 focus:ring-blue-500/20 focus:border-blue-500'} rounded-xl font-bold text-lg text-white focus:outline-none focus:ring-4 transition-all`}
                    />
                  </div>
                  <button 
                    type="button"
                    onClick={() => ajustarNota(parcial, setParcial, 'parcial', 1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    +
                  </button>
                </div>
                {errores.parcial && (
                  <p className="text-xs text-rose-400 mt-1.5 flex items-center gap-1">⚠️ {errores.parcial}</p>
                )}
              </div>

              {/* Nota Examen Final (40%) */}
              <div className="p-4 rounded-2xl bg-slate-900/40 border border-slate-700/60 transition-all hover:border-pink-500/50">
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-pink-500"></span>
                    Nota Examen Final
                  </label>
                  <span className="text-xs font-extrabold text-pink-400 bg-pink-500/10 px-2 py-0.5 rounded-md border border-pink-500/20">
                    Peso: 40%
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <button 
                    type="button"
                    onClick={() => ajustarNota(examenFinal, setExamenFinal, 'examenFinal', -1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    -
                  </button>
                  <div className="relative flex-1">
                    <input 
                      type="text" 
                      value={examenFinal}
                      onChange={(e) => handleInputChange(e.target.value, setExamenFinal, 'examenFinal')}
                      placeholder="0.0"
                      className={`w-full text-center py-2 px-3 bg-slate-900 border ${errores.examenFinal ? 'border-rose-500 focus:ring-rose-500/20' : 'border-slate-700 focus:ring-pink-500/20 focus:border-pink-500'} rounded-xl font-bold text-lg text-white focus:outline-none focus:ring-4 transition-all`}
                    />
                  </div>
                  <button 
                    type="button"
                    onClick={() => ajustarNota(examenFinal, setExamenFinal, 'examenFinal', 1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    +
                  </button>
                </div>
                {errores.examenFinal && (
                  <p className="text-xs text-rose-400 mt-1.5 flex items-center gap-1">⚠️ {errores.examenFinal}</p>
                )}
              </div>

              {/* Nota de Participación (10%) */}
              <div className="p-4 rounded-2xl bg-slate-900/40 border border-slate-700/60 transition-all hover:border-amber-500/50">
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                    Nota de Participación (Actitudinal)
                  </label>
                  <span className="text-xs font-extrabold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">
                    Peso: 10%
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <button 
                    type="button"
                    onClick={() => ajustarNota(participacion, setParticipacion, 'participacion', -1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    -
                  </button>
                  <div className="relative flex-1">
                    <input 
                      type="text" 
                      value={participacion}
                      onChange={(e) => handleInputChange(e.target.value, setParticipacion, 'participacion')}
                      placeholder="0.0"
                      className={`w-full text-center py-2 px-3 bg-slate-900 border ${errores.participacion ? 'border-rose-500 focus:ring-rose-500/20' : 'border-slate-700 focus:ring-amber-500/20 focus:border-amber-500'} rounded-xl font-bold text-lg text-white focus:outline-none focus:ring-4 transition-all`}
                    />
                  </div>
                  <button 
                    type="button"
                    onClick={() => ajustarNota(participacion, setParticipacion, 'participacion', 1)}
                    className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold flex items-center justify-center transition"
                  >
                    +
                  </button>
                </div>
                {errores.participacion && (
                  <p className="text-xs text-rose-400 mt-1.5 flex items-center gap-1">⚠️ {errores.participacion}</p>
                )}
              </div>

            </div>

            {/* Limpiador de formulario */}
            <div className="mt-6 flex justify-end">
              <button 
                onClick={() => {
                  setPractica('0');
                  setParcial('0');
                  setExamenFinal('0');
                  setParticipacion('0');
                  setErrores({ practica: '', parcial: '', examenFinal: '', participacion: '' });
                }}
                className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white transition-all hover:bg-slate-700/50 rounded-xl border border-slate-700"
              >
                Resetear Notas
              </button>
            </div>
          </div>

          {/* Gráfico Visual de Distribución de Pesos */}
          <div className="bg-slate-800/60 border border-slate-700 p-5 rounded-3xl">
            <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3">Distribución de Pesos</h3>
            <div className="flex h-3 rounded-full overflow-hidden bg-slate-900">
              <div className="bg-violet-500 transition-all duration-300" style={{ width: '20%' }} title="Práctica (20%)"></div>
              <div className="bg-blue-500 transition-all duration-300" style={{ width: '30%' }} title="Parcial (30%)"></div>
              <div className="bg-pink-500 transition-all duration-300" style={{ width: '40%' }} title="Examen Final (40%)"></div>
              <div className="bg-amber-500 transition-all duration-300" style={{ width: '10%' }} title="Participación (10%)"></div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4 text-xs text-slate-400">
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-violet-500"></span> Práctica (20%)</span>
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Parcial (30%)</span>
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-pink-500"></span> Final (40%)</span>
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Participación (10%)</span>
            </div>
          </div>
        </section>

        {/* COLUMNA DERECHA: Resultados y simulaciones */}
        <section className="lg:col-span-5 flex flex-col gap-6">
          
          {/* Tarjeta de Promedio Final */}
          <div className="bg-slate-800/90 backdrop-blur border border-slate-700 p-6 rounded-3xl shadow-xl overflow-hidden relative">
            <div className="absolute top-0 right-0 w-24 h-24 bg-indigo-500/10 rounded-full filter blur-2xl pointer-events-none"></div>
            
            <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2">
              <span className="text-2xl">🎓</span> Tu Resultado Académico
            </h2>

            {tieneErrores ? (
              <div className="flex flex-col items-center justify-center py-10 text-center">
                <div className="text-5xl mb-4">✍️</div>
                <h3 className="font-bold text-lg text-slate-300">Esperando datos válidos</h3>
                <p className="text-sm text-slate-400 max-w-xs mt-1">Por favor, corrige los errores de validación de las notas en el panel izquierdo para calcular tu promedio.</p>
              </div>
            ) : (
              <div className="space-y-6">
                
                {/* Visualizador de Promedio Redondeado */}
                <div className="flex flex-col items-center justify-center py-4 relative">
                  
                  {/* Círculo de progreso */}
                  <div className="relative w-40 h-40 flex items-center justify-center">
                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                      <circle 
                        cx="50" cy="50" r="42" 
                        className="stroke-slate-700" 
                        strokeWidth="8" fill="transparent" 
                      />
                      <circle 
                        cx="50" cy="50" r="42" 
                        className={`transition-all duration-500 ${aprobado ? 'stroke-emerald-500' : 'stroke-rose-500'}`}
                        strokeWidth="8" fill="transparent" 
                        strokeDasharray={2 * Math.PI * 42}
                        strokeDashoffset={2 * Math.PI * 42 * (1 - promedioRedondeado / 20)}
                        strokeLinecap="round"
                      />
                    </svg>
                    
                    {/* Nota Central */}
                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                      <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Promedio</span>
                      <span className="text-4xl font-black text-white">{promedioRedondeado.toFixed(1)}</span>
                      <span className="text-[10px] text-slate-400">Escala 20</span>
                    </div>
                  </div>

                  {/* Estado Badge */}
                  <div className="mt-4">
                    {aprobado ? (
                      <span className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> APROBADO
                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-extrabold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                        <span className="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span> DESAPROBADO
                      </span>
                    )}
                  </div>
                </div>

                {/* Línea de Progreso Simple Lineal */}
                <div className="space-y-1">
                  <div className="flex justify-between text-xs text-slate-400">
                    <span>Equivalente en porcentaje</span>
                    <span className="font-bold">{((promedioRedondeado / 20) * 100).toFixed(0)}%</span>
                  </div>
                  <div className="h-2 rounded-full bg-slate-900 overflow-hidden">
                    <div 
                      className={`h-full rounded-full transition-all duration-500 ${aprobado ? 'bg-gradient-to-r from-teal-500 to-emerald-500' : 'bg-gradient-to-r from-pink-500 to-rose-500'}`}
                      style={{ width: `${(promedioRedondeado / 20) * 100}%` }}
                    ></div>
                  </div>
                </div>

                {/* Cuadro de Recomendación y Feedback */}
                <div className={`p-4 rounded-2xl border transition-all duration-300 ${recomendacion.color}`}>
                  <div className="flex items-start gap-3">
                    <span className="text-2xl mt-0.5">{recomendacion.emoji}</span>
                    <div>
                      <h4 className="font-bold text-sm mb-1">{recomendacion.titulo}</h4>
                      <p className="text-xs leading-relaxed opacity-90">{recomendacion.texto}</p>
                    </div>
                  </div>
                </div>

              </div>
            )}
          </div>

          {/* Predictor Académico (¿Cuánto necesito?) */}
          {!tieneErrores && (
            <div className="bg-slate-800/90 backdrop-blur border border-slate-700 p-6 rounded-3xl shadow-xl relative overflow-hidden">
              <div className="absolute -bottom-10 -right-10 w-24 h-24 bg-amber-500/10 rounded-full filter blur-2xl pointer-events-none"></div>

              <h2 className="text-base font-bold text-white mb-4 flex items-center gap-2">
                <span className="text-xl">🔮</span> Simulador de Examen Final
              </h2>

              <p className="text-xs text-slate-300 leading-relaxed mb-4">
                Si tus notas de <strong className="text-violet-400">Práctica ({practica})</strong>, <strong className="text-blue-400">Parcial ({parcial})</strong> y <strong className="text-amber-400">Participación ({participacion})</strong> se mantienen fijas:
              </p>

              {notaFinalNecesaria <= 0 ? (
                <div className="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300">
                  <div className="flex items-center gap-2 mb-1.5">
                    <span className="text-xl">🎉</span>
                    <span className="font-bold text-sm">¡Ya aprobaste la materia!</span>
                  </div>
                  <p className="text-xs text-slate-300">
                    Matemáticamente ya has asegurado la aprobación del ciclo, incluso si obtienes un <strong>0.0</strong> en el Examen Final. ¡Felicidades por tu excelente desempeño previo!
                  </p>
                </div>
              ) : notaFinalNecesaria > 20 ? (
                <div className="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300">
                  <div className="flex items-center gap-2 mb-1.5">
                    <span className="text-xl">🛑</span>
                    <span className="font-bold text-sm">Caso Matemáticamente Complejo</span>
                  </div>
                  <p className="text-xs text-slate-300">
                    Incluso obteniendo un <strong>20.0</strong> en el Examen Final, tu promedio actual no alcanza para superar el mínimo aprobatorio. Te sugerimos conversar urgentemente con tu docente de curso para revisar alternativas académicas.
                  </p>
                </div>
              ) : (
                <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-700 flex flex-col sm:flex-row items-center gap-4 justify-between">
                  <div className="text-center sm:text-left">
                    <div className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Nota mínima requerida</div>
                    <div className="text-xs text-indigo-300 mt-0.5">En tu Examen Final</div>
                  </div>
                  <div className="flex items-baseline gap-1 bg-indigo-500/10 px-4 py-2 rounded-2xl border border-indigo-500/20">
                    <span className="text-2xl font-black text-indigo-300">{notaFinalNecesariaRedondeada.toFixed(1)}</span>
                    <span className="text-xs text-slate-400">/20.0</span>
                  </div>
                </div>
              )}
            </div>
          )}

        </section>

      </main>

      {/* Footer / Pie de página */}
      <footer className="max-w-5xl mx-auto px-4 mt-12 text-center text-xs text-slate-500">
        <hr className="border-slate-800 mb-6" />
        <p className="mb-1">
          Hecho con ❤️ para la comunidad de estudiantes universitarios.
        </p>
        <p>
          Recuerda que esta herramienta es referencial. Las políticas específicas de redondeo y pesos pueden variar según cada universidad o facultad.
        </p>
      </footer>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
