<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VelociRead - Lector de Lectura Veloz (RSVP) & Evaluación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- TEXTO DE EJEMPLO INICIAL ---
    const DEFAULT_SAMPLE_TEXT = `La lectura rápida mediante presentación visual serial rápida (RSVP) es una técnica cognitiva diseñada para incrementar la velocidad lectora eliminando la necesidad de realizar movimientos oculares sacádicos. En la lectura convencional, los ojos saltan constantemente de izquierda a derecha buscando fijarse en cada palabra, lo que consume hasta el ochenta por ciento del tiempo total de procesamiento. Al proyectar una sola palabra a la vez en un punto óptimo de reconocimiento (ORP), el cerebro humano puede asimilar información a velocidades superiores a seiscientas palabras por minuto manteniendo una alta retención conceptual. Diversos estudios en neurociencia aplicada demuestran que entrenar la velocidad efectiva permite reducir la subvocalización interna y potenciar la agilidad mental.`;

    // Función de ayuda para llamadas HTTP con reintentos
    const fetchWithRetry = async (url, options, maxRetries = 3) => {
      let delay = 1000;
      for (let i = 0; i < maxRetries; i++) {
        try {
          const res = await fetch(url, options);
          if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
          return await res.json();
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 1.8;
        }
      }
    };

    // Generador Heurístico Offline de Preguntas de Comprensión
    const generateLocalQuiz = (rawText) => {
      const sentences = rawText
        .split(/[.!?]+/)
        .map(s => s.trim())
        .filter(s => s.length > 25);

      const words = rawText.match(/\b[A-Za-záéíóúÁÉÍÓÚñÑ]{4,}\b/g) || [];
      const wordFreq = {};
      words.forEach(w => {
        const lower = w.toLowerCase();
        if (!['para', 'como', 'este', 'esta', 'estos', 'estas', 'entre', 'sobre', 'desde', 'hasta', 'cuando', 'donde', 'porque'].includes(lower)) {
          wordFreq[lower] = (wordFreq[lower] || 0) + 1;
        }
      });
      const topKeywords = Object.keys(wordFreq).sort((a, b) => wordFreq[b] - wordFreq[a]).slice(0, 6);
      const mainWord = topKeywords[0] ? topKeywords[0].toUpperCase() : "EL TEMA";

      return [
        {
          pregunta: `¿Cuál es el eje temático o concepto central abordado en el texto?`,
          opciones: [
            sentences[0] ? `${sentences[0].slice(0, 75)}...` : `El desarrollo de ${mainWord} y sus fundamentos`,
            `Un análisis histórico sobre la invención de la imprenta moderna`,
            `Un informe financiero sobre costos operativos en empresas`,
            `Una guía de programación para aplicaciones móviles nativas`
          ],
          correcta: 0
        },
        {
          pregunta: sentences[1] 
            ? `Según lo expuesto en el texto, ¿qué afirmación se corresponde directamente con el contenido?`
            : `¿Qué beneficio o implicancia principal destaca el autor?`,
          opciones: [
            `El fenómeno no presenta ninguna utilidad demostrable en la práctica`,
            sentences[1] ? sentences[1].slice(0, 80) : `Permite optimizar el procesamiento mental y la retención`,
            `Requiere obligatoriamente de equipamiento médico especializado de alto costo`,
            `Fue descartado por la comunidad científica a mediados del siglo pasado`
          ],
          correcta: 1
        },
        {
          pregunta: `¿Qué rol cumplen elementos clave como "${topKeywords[1] || 'las variables'}" o "${topKeywords[2] || 'el proceso'}" en el texto?`,
          opciones: [
            `Son factores opcionales que contradicen la tesis principal expuesta`,
            `Son meros ejemplos decorativos sin relación con la lectura`,
            `Son componentes estructurales directamente vinculados al rendimiento o impacto analizado`,
            `Son errores de transcripción señalados en el párrafo de cierre`
          ],
          correcta: 2
        },
        {
          pregunta: `¿A qué conclusión general conduce la lectura respecto al tema abordado?`,
          opciones: [
            `Se recomienda suspender cualquier práctica relacionada por falta de evidencia`,
            `Los métodos tradicionales son insuperables en todos los escenarios posibles`,
            `El resultado depende exclusivamente de factores genéticos inalterables`,
            `La aplicación metódica y el entrenamiento permiten alcanzar mejores niveles de desempeño`
          ],
          correcta: 3
        }
      ];
    };

    function App() {
      const [step, setStep] = useState('entry'); // 'entry' | 'reading' | 'quiz' | 'result'
      const [text, setText] = useState(DEFAULT_SAMPLE_TEXT);
      const [words, setWords] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [wpm, setWpm] = useState(320);
      const [isPlaying, setIsPlaying] = useState(false);
      const [theme, setTheme] = useState('dark');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('veloci_gemini_key') || '');
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);

      // Estados del cuestionario
      const [questions, setQuestions] = useState([]);
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState([]);
      const [isLoadingQuiz, setIsLoadingQuiz] = useState(false);
      const [quizError, setQuizError] = useState(null);
      const [quizSource, setQuizSource] = useState('ia'); // 'ia' | 'local'

      const timerRef = useRef(null);

      // Guardar API Key en localStorage
      const handleSaveApiKey = (newKey) => {
        setApiKey(newKey);
        localStorage.setItem('veloci_gemini_key', newKey);
        setShowApiKeyModal(false);
      };

      // Separación de palabras
      const processText = (rawText) => {
        if (!rawText.trim()) return [];
        return rawText.trim().split(/\s+/);
      };

      const handleStartReading = () => {
        const parsedWords = processText(text);
        if (parsedWords.length === 0) {
          alert("Por favor, ingresa o pega algún texto para comenzar.");
          return;
        }
        setWords(parsedWords);
        setCurrentIndex(0);
        setStep('reading');
        setIsPlaying(true);
      };

      // Bucle de reproducción RSVP
      useEffect(() => {
        if (isPlaying && step === 'reading') {
          const intervalMs = (60 / wpm) * 1000;
          timerRef.current = setTimeout(() => {
            if (currentIndex < words.length - 1) {
              setCurrentIndex(prev => prev + 1);
            } else {
              setIsPlaying(false);
            }
          }, intervalMs);
        }
        return () => {
          if (timerRef.current) clearTimeout(timerRef.current);
        };
      }, [isPlaying, currentIndex, wpm, words, step]);

      // Atajo de teclado: Barra espaciadora para Play/Pause
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (step === 'reading' && e.code === 'Space') {
            e.preventDefault();
            setIsPlaying(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [step]);

      // Punto Óptimo de Reconocimiento (ORP)
      const getOrpSplit = (word) => {
        if (!word) return { left: '', mid: '', right: '' };
        let midIndex = 0;
        if (word.length <= 1) midIndex = 0;
        else if (word.length <= 5) midIndex = 1;
        else if (word.length <= 9) midIndex = 2;
        else if (word.length <= 13) midIndex = 3;
        else midIndex = 4;

        return {
          left: word.slice(0, midIndex),
          mid: word[midIndex] || '',
          right: word.slice(midIndex + 1)
        };
      };

      // Generación de preguntas (Gemini si hay key, fallback local inteligente si no)
      const handleGenerateQuiz = async () => {
        setIsLoadingQuiz(true);
        setQuizError(null);
        setStep('quiz');
        setQuestions([]);
        setCurrentQuestionIndex(0);
        setUserAnswers([]);

        if (apiKey && apiKey.trim().length > 10) {
          try {
            const systemPrompt = `Eres un evaluador de comprensión lectora profesional. Genera exactamente 4 preguntas de opción múltiple basadas exclusivamente en el texto en español proporcionado.
Cada pregunta debe tener exactamente 4 opciones diferentes en el orden que desees, con 'correcta' siendo el índice del 0 al 3.
Retorna únicamente JSON en el formato: [{"pregunta":"...","opciones":["...","...","...","..."],"correcta":0}].`;

            const payload = {
              contents: [{ parts: [{ text: `Analiza este texto y genera la evaluación:\n\n${text}` }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: "application/json"
              }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey.trim()}`;
            const data = await fetchWithRetry(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (textResponse) {
              const cleanJson = textResponse.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
              const parsed = JSON.parse(cleanJson);
              if (Array.isArray(parsed) && parsed.length >= 3) {
                setQuestions(parsed);
                setQuizSource('ia');
                setIsLoadingQuiz(false);
                return;
              }
            }
          } catch (err) {
            console.warn("Fallo llamada a Gemini API, activando generador heurístico:", err);
          }
        }

        // Si no hay API key o falló la llamada remota, usar generador local
        setTimeout(() => {
          const localQuestions = generateLocalQuiz(text);
          setQuestions(localQuestions);
          setQuizSource('local');
          setIsLoadingQuiz(false);
        }, 600);
      };

      const handleSelectAnswer = (index) => {
        const updatedAnswers = [...userAnswers, index];
        setUserAnswers(updatedAnswers);

        if (currentQuestionIndex < questions.length - 1) {
          setCurrentQuestionIndex(prev => prev + 1);
        } else {
          setStep('result');
        }
      };

      const getAciertos = () => {
        let score = 0;
        questions.forEach((q, idx) => {
          if (q.correcta === userAnswers[idx]) score++;
        });
        return score;
      };

      const aciertos = getAciertos();
      const totalPreguntas = questions.length || 4;
      const porcentajeComprension = Math.round((aciertos / totalPreguntas) * 100);
      const velocidadEfectiva = Math.round(wpm * (porcentajeComprension / 100));

      const handleRestart = () => {
        setStep('entry');
        setWords([]);
        setCurrentIndex(0);
        setQuestions([]);
        setUserAnswers([]);
      };

      const activeWord = words[currentIndex] || '';
      const orp = getOrpSplit(activeWord);

      return (
        <div className={`min-h-screen font-sans transition-colors duration-300 flex flex-col ${
          theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'
        }`}>
          {/* HEADER */}
          <header className={`border-b px-4 sm:px-6 py-4 flex justify-between items-center sticky top-0 z-40 backdrop-blur-md ${
            theme === 'dark' ? 'border-slate-800 bg-slate-900/90' : 'border-slate-200 bg-white/95'
          }`}>
            <div className="flex items-center gap-3">
              <a 
                href="../../index.html" 
                className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${
                  theme === 'dark' 
                    ? 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-slate-300' 
                    : 'bg-slate-100 border-slate-300 hover:bg-slate-200 text-slate-700'
                }`}
              >
                ← Repositorio Docente
              </a>

              <div className="flex items-center gap-2 pl-2 border-l border-slate-700/50">
                <div className="bg-amber-500 text-slate-950 p-1.5 rounded-lg font-black flex items-center justify-center">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-bold tracking-tight leading-none">VelociRead</h1>
                  <span className={`text-[10px] hidden sm:inline ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Lector de Lectura Veloz & Evaluación</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {/* Botón API Key */}
              <button
                onClick={() => setShowApiKeyModal(true)}
                className={`px-3 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition ${
                  apiKey 
                    ? 'border-emerald-500/50 text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20' 
                    : 'border-slate-700 text-slate-400 hover:text-slate-200'
                }`}
                title="Configurar Gemini API Key (Opcional)"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 7a2 2 0 0 1 2 2m4 0a6 6 0 0 1-7.743 5.743L11 17H9v2H7v2H4a1 1 0 0 1-1-1v-2.586a1 1 0 0 1 .293-.707l5.964-5.964A6 6 0 1 1 21 9z" />
                </svg>
                <span className="hidden sm:inline">{apiKey ? 'Gemini IA Activa' : 'Configurar IA'}</span>
              </button>

              {/* Botón Tema */}
              <button
                onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                className={`p-2 rounded-lg border transition ${
                  theme === 'dark' ? 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-slate-300' : 'bg-white border-slate-300 hover:bg-slate-100 text-slate-700'
                }`}
                title="Cambiar tema"
              >
                {theme === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>
          </header>

          {/* CUERPO PRINCIPAL */}
          <main className="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full flex flex-col justify-center">

            {/* PANTALLA 1: ENTRADA DE TEXTO */}
            {step === 'entry' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="text-center space-y-2">
                  <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight">Entrena tu velocidad de lectura</h2>
                  <p className={`text-sm sm:text-base max-w-xl mx-auto ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                    Pega cualquier texto o artículo. La técnica RSVP eliminará la pérdida de tiempo en saltos oculares.
                  </p>
                </div>

                <div className={`p-6 rounded-2xl border shadow-xl ${
                  theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                }`}>
                  <div className="flex justify-between items-center mb-2">
                    <label className={`text-xs font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                      Texto a leer
                    </label>
                    <span className="text-xs text-amber-500 font-mono">
                      {text.trim() ? text.trim().split(/\s+/).length : 0} palabras
                    </span>
                  </div>

                  <textarea
                    rows={7}
                    value={text}
                    onChange={(e) => setText(e.target.value)}
                    placeholder="Pega aquí el artículo, capítulo o texto que deseas leer..."
                    className={`w-full p-4 rounded-xl border text-sm sm:text-base focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all resize-y ${
                      theme === 'dark' 
                        ? 'bg-slate-950 border-slate-800 text-slate-100 placeholder-slate-600' 
                        : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-400'
                    }`}
                  />

                  <div className="flex flex-col sm:flex-row gap-4 items-center justify-between mt-5 pt-4 border-t border-slate-800/40">
                    <div className="flex items-center gap-3">
                      <span className={`text-xs sm:text-sm font-medium ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                        Velocidad:
                      </span>
                      <div className="flex items-center gap-2">
                        <button 
                          onClick={() => setWpm(Math.max(100, wpm - 50))}
                          className={`px-2.5 py-1 rounded border text-xs font-bold ${
                            theme === 'dark' ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-100 border-slate-300 text-slate-700'
                          }`}
                        >
                          -50
                        </button>
                        <span className="font-mono font-bold text-amber-500 text-base sm:text-lg w-20 text-center">
                          {wpm} <span className="text-xs">ppm</span>
                        </span>
                        <button 
                          onClick={() => setWpm(Math.min(1000, wpm + 50))}
                          className={`px-2.5 py-1 rounded border text-xs font-bold ${
                            theme === 'dark' ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-100 border-slate-300 text-slate-700'
                          }`}
                        >
                          +50
                        </button>
                      </div>
                    </div>

                    <button
                      onClick={handleStartReading}
                      disabled={!text.trim()}
                      className={`w-full sm:w-auto px-8 py-3 rounded-xl font-bold shadow-lg transition-all transform active:scale-95 ${
                        text.trim()
                          ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 hover:from-amber-400 hover:to-amber-500 cursor-pointer shadow-amber-500/20'
                          : 'bg-slate-800 text-slate-600 cursor-not-allowed border border-slate-700'
                      }`}
                    >
                      Comenzar Lectura RSVP →
                    </button>
                  </div>
                </div>

                {/* Guías rápidas */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 text-center">
                  <div className={`p-4 rounded-xl border ${theme === 'dark' ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div className="text-amber-500 font-bold text-sm mb-1">Punto Óptimo (ORP)</div>
                    <p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>Alineamos la letra de anclaje para que tu mirada se mantenga fija en el centro.</p>
                  </div>
                  <div className={`p-4 rounded-xl border ${theme === 'dark' ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div className="text-amber-500 font-bold text-sm mb-1">Evaluación de Retención</div>
                    <p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>Al finalizar la lectura, pondrás a prueba tu nivel de comprensión con 4 preguntas clave.</p>
                  </div>
                  <div className={`p-4 rounded-xl border ${theme === 'dark' ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div className="text-amber-500 font-bold text-sm mb-1">Velocidad Efectiva</div>
                    <p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>Calcula tu tasa real de asimilación multiplicando las PPM por el porcentaje de aciertos.</p>
                  </div>
                </div>
              </div>
            )}

            {/* PANTALLA 2: REPRODUCTOR RSVP */}
            {step === 'reading' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="flex justify-between items-center">
                  <button
                    onClick={() => {
                      setIsPlaying(false);
                      setStep('entry');
                    }}
                    className={`flex items-center gap-1.5 text-xs font-semibold hover:underline ${
                      theme === 'dark' ? 'text-slate-400 hover:text-slate-200' : 'text-slate-600 hover:text-slate-800'
                    }`}
                  >
                    ← Volver al texto
                  </button>

                  <div className={`text-xs font-mono px-3 py-1.5 rounded-full ${
                    theme === 'dark' ? 'bg-slate-900 text-slate-400 border border-slate-800' : 'bg-slate-200 text-slate-700'
                  }`}>
                    Palabra <span className="font-bold text-amber-500">{currentIndex + 1}</span> de <span className="font-bold">{words.length}</span>
                  </div>
                </div>

                {/* DISPLAY RSVP */}
                <div className={`relative h-64 sm:h-72 rounded-3xl border flex flex-col justify-center items-center overflow-hidden shadow-2xl transition-all ${
                  theme === 'dark' ? 'bg-slate-950 border-slate-800 shadow-amber-500/5' : 'bg-white border-slate-200 shadow-slate-200'
                }`}>
                  {/* Guías ORP */}
                  <div className="absolute top-0 left-1/2 -translate-x-1/2 flex flex-col items-center">
                    <div className="w-1 h-5 bg-amber-500 rounded-b-sm"></div>
                  </div>
                  <div className="absolute bottom-0 left-1/2 -translate-x-1/2 flex flex-col items-center">
                    <div className="w-1 h-5 bg-amber-500 rounded-t-sm"></div>
                  </div>

                  {/* Palabra centrada en el ORP */}
                  <div className="w-full flex justify-center items-center text-4xl sm:text-6xl md:text-7xl font-mono select-none tracking-tight px-4">
                    {activeWord ? (
                      <>
                        <span className={`w-1/2 text-right opacity-40 font-mono ${theme === 'dark' ? 'text-slate-100' : 'text-slate-900'}`}>
                          {orp.left}
                        </span>
                        <span className="text-amber-500 font-extrabold font-mono px-0.5">
                          {orp.mid}
                        </span>
                        <span className={`w-1/2 text-left opacity-90 font-mono ${theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}`}>
                          {orp.right}
                        </span>
                      </>
                    ) : (
                      <span className="text-slate-500 text-2xl font-sans font-medium">Fin de la lectura</span>
                    )}
                  </div>
                </div>

                {/* CONTROLES */}
                <div className={`p-5 rounded-2xl border space-y-5 shadow-md ${
                  theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                }`}>
                  <div className="flex justify-center items-center gap-4 sm:gap-6">
                    <button
                      onClick={() => setCurrentIndex(Math.max(0, currentIndex - 10))}
                      disabled={currentIndex === 0}
                      className={`p-3 rounded-full border transition ${
                        theme === 'dark' 
                          ? 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-slate-300 disabled:opacity-30' 
                          : 'bg-slate-100 border-slate-300 hover:bg-slate-200 text-slate-700 disabled:opacity-30'
                      }`}
                      title="Retroceder 10 palabras"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z" />
                      </svg>
                    </button>

                    <button
                      onClick={() => {
                        if (currentIndex === words.length - 1) {
                          setCurrentIndex(0);
                          setIsPlaying(true);
                        } else {
                          setIsPlaying(!isPlaying);
                        }
                      }}
                      className="px-8 py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black shadow-lg shadow-amber-500/20 transition transform active:scale-95 flex items-center gap-2"
                    >
                      {isPlaying ? (
                        <>
                          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                          PAUSAR
                        </>
                      ) : (
                        <>
                          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                          {currentIndex === words.length - 1 ? 'REPETIR' : 'CONTINUAR'}
                        </>
                      )}
                    </button>

                    <button
                      onClick={() => setCurrentIndex(Math.min(words.length - 1, currentIndex + 10))}
                      disabled={currentIndex >= words.length - 1}
                      className={`p-3 rounded-full border transition ${
                        theme === 'dark' 
                          ? 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-slate-300 disabled:opacity-30' 
                          : 'bg-slate-100 border-slate-300 hover:bg-slate-200 text-slate-700 disabled:opacity-30'
                      }`}
                      title="Avanzar 10 palabras"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z" />
                      </svg>
                    </button>
                  </div>

                  {/* Slider de Velocidad */}
                  <div className="space-y-1.5 pt-2">
                    <div className="flex justify-between items-center text-xs font-semibold opacity-70">
                      <span>Ritmo de lectura:</span>
                      <span className="text-amber-500 font-bold font-mono">{wpm} palabras por minuto</span>
                    </div>
                    <input
                      type="range"
                      min="100"
                      max="1000"
                      step="25"
                      value={wpm}
                      onChange={(e) => setWpm(parseInt(e.target.value, 10))}
                      className="w-full h-2 rounded-lg appearance-none cursor-pointer bg-slate-700 accent-amber-500"
                    />
                    <div className="flex justify-between text-[10px] text-slate-500 font-mono">
                      <span>100 ppm</span>
                      <span>350 ppm (Promedio ágil)</span>
                      <span>600 ppm</span>
                      <span>1000 ppm</span>
                    </div>
                  </div>

                  <div className="text-center text-xs text-slate-500">
                    Atajo: Presiona la <kbd className="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-mono border border-slate-700 text-[10px]">Barra Espaciadora</kbd> para pausar o continuar.
                  </div>
                </div>

                {/* BOTÓN AL COMPLETAR LECTURA */}
                {currentIndex === words.length - 1 && !isPlaying && (
                  <div className="text-center py-4 animate-bounce">
                    <button
                      onClick={handleGenerateQuiz}
                      className="px-8 py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-black shadow-xl hover:from-emerald-400 hover:to-teal-500 transition transform hover:scale-105 inline-flex items-center gap-2 cursor-pointer"
                    >
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                      Realizar Evaluación de Comprensión
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* PANTALLA 3: CUESTIONARIO */}
            {step === 'quiz' && (
              <div className="max-w-2xl mx-auto space-y-6 animate-fadeIn">
                <div className="text-center space-y-1">
                  <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Evaluación de Retención</h2>
                  <p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                    {quizSource === 'ia' ? '✨ Generado en tiempo real con Gemini IA' : '🧠 Generado con análisis de conceptos clave'}
                  </p>
                </div>

                {isLoadingQuiz && (
                  <div className={`p-12 text-center rounded-3xl border flex flex-col items-center justify-center space-y-4 shadow-xl ${
                    theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}>
                    <div className="w-12 h-12 rounded-full border-4 border-amber-500/20 border-t-amber-500 animate-spin"></div>
                    <div className="space-y-1">
                      <p className="font-bold text-base text-amber-500">Diseñando evaluación...</p>
                      <p className={`text-xs max-w-sm ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                        Extrayendo afirmaciones e ideas esenciales de tu lectura.
                      </p>
                    </div>
                  </div>
                )}

                {!isLoadingQuiz && questions.length > 0 && (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center px-1">
                      <span className={`text-xs font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                        Pregunta {currentQuestionIndex + 1} de {questions.length}
                      </span>
                      <div className="w-32 bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div 
                          className="bg-amber-500 h-full transition-all duration-300"
                          style={{ width: `${((currentQuestionIndex + 1) / questions.length) * 100}%` }}
                        />
                      </div>
                    </div>

                    <div className={`p-6 sm:p-8 rounded-3xl border shadow-xl space-y-6 ${
                      theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                    }`}>
                      <h3 className="text-lg sm:text-xl font-bold tracking-tight leading-snug">
                        {questions[currentQuestionIndex].pregunta}
                      </h3>

                      <div className="grid grid-cols-1 gap-3">
                        {questions[currentQuestionIndex].opciones.map((opcion, opIndex) => (
                          <button
                            key={opIndex}
                            onClick={() => handleSelectAnswer(opIndex)}
                            className={`w-full text-left p-4 rounded-xl border text-sm font-medium transition-all transform active:scale-98 flex items-start gap-3 cursor-pointer ${
                              theme === 'dark'
                                ? 'bg-slate-950 border-slate-800 hover:border-amber-500 hover:bg-amber-500/10 text-slate-200'
                                : 'bg-slate-50 border-slate-200 hover:border-amber-500 hover:bg-amber-500/10 text-slate-800'
                            }`}
                          >
                            <span className="flex-shrink-0 w-6 h-6 rounded-full bg-amber-500/10 text-amber-500 border border-amber-500/30 flex items-center justify-center text-xs font-bold font-mono">
                              {String.fromCharCode(65 + opIndex)}
                            </span>
                            <span className="leading-snug">{opcion}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* PANTALLA 4: RESULTADOS */}
            {step === 'result' && (
              <div className="max-w-2xl mx-auto space-y-6 animate-fadeIn">
                <div className="text-center space-y-1">
                  <h2 className="text-3xl font-extrabold tracking-tight">Rendimiento de Lectura</h2>
                  <p className={`text-sm ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                    Balance entre velocidad nominal y asimilación conceptual.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className={`p-5 rounded-2xl border text-center space-y-1 shadow-md ${
                    theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Comprensión</span>
                    <div className="text-3xl sm:text-4xl font-extrabold text-amber-500 font-mono">
                      {porcentajeComprension}%
                    </div>
                    <div className="text-xs text-slate-500 font-medium">
                      {aciertos} de {totalPreguntas} aciertos
                    </div>
                  </div>

                  <div className={`p-5 rounded-2xl border text-center space-y-1 shadow-md ${
                    theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Velocidad</span>
                    <div className="text-3xl sm:text-4xl font-extrabold text-amber-500 font-mono">
                      {wpm} <span className="text-sm font-normal">ppm</span>
                    </div>
                    <div className="text-xs text-slate-500 font-medium">Ritmo configurado</div>
                  </div>

                  <div className={`p-5 rounded-2xl border text-center space-y-1 shadow-md relative overflow-hidden ${
                    theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}>
                    <div className="absolute top-0 right-0 bg-emerald-500 text-slate-950 font-bold text-[8px] uppercase tracking-widest px-2 py-0.5 rounded-bl-lg">
                      Oro
                    </div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Velocidad Efectiva</span>
                    <div className="text-3xl sm:text-4xl font-extrabold text-emerald-500 font-mono">
                      {velocidadEfectiva} <span className="text-sm font-normal">ppm</span>
                    </div>
                    <div className="text-xs text-slate-500 font-medium">Lectura neta comprendida</div>
                  </div>
                </div>

                {/* Revisión de Preguntas */}
                {questions.length > 0 && (
                  <div className="space-y-3 pt-2">
                    <h3 className="text-sm font-bold tracking-wide uppercase text-slate-400">Revisión de Respuestas</h3>
                    {questions.map((q, qIndex) => {
                      const isCorrect = q.correcta === userAnswers[qIndex];
                      return (
                        <div 
                          key={qIndex} 
                          className={`p-4 rounded-xl border space-y-2 text-xs ${
                            theme === 'dark' ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-200'
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2">
                            <span className="font-semibold text-slate-200">{qIndex + 1}. {q.pregunta}</span>
                            <span className={`px-2 py-0.5 rounded-full font-bold uppercase text-[10px] ${
                              isCorrect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'
                            }`}>
                              {isCorrect ? 'Correcta' : 'Incorrecta'}
                            </span>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                            <div className="p-2 rounded bg-slate-950/40">
                              <span className="opacity-50">Tu elección: </span>
                              <span className={isCorrect ? 'text-emerald-400 font-medium' : 'text-red-400 font-medium'}>
                                {q.opciones[userAnswers[qIndex]] || '(Sin respuesta)'}
                              </span>
                            </div>
                            {!isCorrect && (
                              <div className="p-2 rounded bg-slate-950/40">
                                <span className="opacity-50">Respuesta correcta: </span>
                                <span className="text-emerald-400 font-medium">{q.opciones[q.correcta]}</span>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div className="text-center pt-2">
                  <button
                    onClick={handleRestart}
                    className="px-6 py-3 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 transition"
                  >
                    Entrenar con otro texto ↺
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* MODAL CONFIGURACIÓN API KEY */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    🔑 Gemini API Key
                  </h3>
                  <button 
                    onClick={() => setShowApiKeyModal(false)}
                    className="text-slate-400 hover:text-slate-200 text-lg leading-none"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-xs text-slate-400 leading-relaxed">
                  (Opcional) Si ingresas una clave de Google AI Studio, las preguntas de evaluación se generarán usando Gemini 2.5 Flash. Si la dejas vacía, la app usará automáticamente el motor heurístico local.
                </p>
                <input 
                  type="password"
                  placeholder="AIzaSy..."
                  defaultValue={apiKey}
                  id="api-key-input"
                  className="w-full p-2.5 rounded-lg bg-slate-950 border border-slate-700 text-slate-100 text-xs font-mono focus:border-amber-500 focus:outline-none"
                />
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => handleSaveApiKey('')}
                    className="px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 text-xs"
                  >
                    Borrar
                  </button>
                  <button
                    onClick={() => {
                      const input = document.getElementById('api-key-input');
                      handleSaveApiKey(input ? input.value : '');
                    }}
                    className="px-4 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs"
                  >
                    Guardar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className={`border-t py-4 text-center text-xs opacity-60 ${
            theme === 'dark' ? 'border-slate-900' : 'border-slate-200'
          }`}>
            Repositorio Docente · Uso Personal · VelociRead RSVP
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
