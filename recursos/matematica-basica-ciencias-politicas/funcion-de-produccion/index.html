<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Función de Producción - Fenómenos Económicos y Sociales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.35s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-blue-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- ICONOS LUCIDE INLINE ---
    const Factory = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
        <path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>
      </svg>
    );

    const TrendingDown = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
        <polyline points="17 18 23 18 23 12"/>
      </svg>
    );

    const TrendingUp = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>
      </svg>
    );

    const GraduationCap = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    );

    const HeartPulse = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h4.27"/>
      </svg>
    );

    const DollarSign = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="12" y1="2" x2="12" y2="22"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    );

    const Calculator = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect width="16" height="20" x="4" y="2" rx="2"/>
        <line x1="8" x2="16" y1="6" y2="6"/>
        <line x1="16" x2="16" y1="14" y2="18"/>
        <path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/>
        <path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>
      </svg>
    );

    const Search = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
    );

    const CheckCircle = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    );

    const Info = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
      </svg>
    );

    const ChevronRight = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m9 18 6-6-6-6"/>
      </svg>
    );

    const ChevronLeft = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m15 18-6-6 6-6"/>
      </svg>
    );

    const Zap = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    );

    // --- SECCIÓN 1: INTRODUCCIÓN ---
    const SectionIntro = () => (
      <div className="animate-in">
        <span className="text-blue-600 font-bold tracking-widest uppercase text-sm">Sección 1: El Punto de Partida</span>
        <h2 className="text-3xl md:text-4xl font-extrabold mt-2 mb-6 text-slate-800">¿De qué depende un resultado?</h2>
        <p className="text-lg md:text-xl text-slate-600 mb-10 leading-relaxed">Muchas variables importantes pueden explicarse a partir de otras variables. Todo fenómeno económico o social es el resultado de varios factores interactuando.</p>
        
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          {[
            { icon: <Factory className="text-blue-500" />, title: 'Producción de Empresa', factors: 'Capital + Trabajo' },
            { icon: <TrendingDown className="text-red-500" />, title: 'Nivel de Pobreza', factors: 'Ingresos + Educación + Salud' },
            { icon: <GraduationCap className="text-indigo-500" />, title: 'Rendimiento Académico', factors: 'Estudio + Entorno + Motivación' },
            { icon: <Zap className="text-yellow-500" />, title: 'Productividad', factors: 'Tecnología + Gestión' },
          ].map((item, i) => (
            <div key={i} className="flex items-center gap-4 p-6 bg-slate-50 rounded-2xl border border-slate-100 hover:border-blue-200 hover:bg-white hover:shadow-md transition-all">
              <div className="p-3 bg-white rounded-xl shadow-sm border border-slate-100">{item.icon}</div>
              <div>
                <h4 className="font-bold text-slate-800">{item.title}</h4>
                <p className="text-slate-500 text-sm">{item.factors}</p>
              </div>
            </div>
          ))}
        </div>

        <div className="mt-10 p-6 bg-blue-50 rounded-2xl border border-blue-100 flex items-start gap-4">
          <Info className="text-blue-600 shrink-0 mt-1" />
          <p className="text-blue-900 font-medium">La idea central es simple: buscamos la relación causal entre insumos (inputs) y un resultado final (output).</p>
        </div>
      </div>
    );

    // --- SECCIÓN 2: CLÁSICA ---
    const SectionClassic = () => (
      <div className="animate-in">
        <span className="text-blue-600 font-bold tracking-widest uppercase text-sm">Sección 2: Economía Clásica</span>
        <h2 className="text-3xl md:text-4xl font-extrabold mt-2 mb-8 text-slate-800">Función de Producción Tradicional</h2>
        
        <div className="flex flex-col items-center justify-center py-10 bg-slate-900 rounded-3xl text-white mb-10 shadow-inner px-4 text-center">
          <div className="text-4xl sm:text-6xl md:text-7xl font-serif italic mb-4 tracking-wide">
            Y = A · K<sup>α</sup> · L<sup>β</sup>
          </div>
          <p className="text-slate-400 font-medium italic">Modelo clásico de Cobb-Douglas</p>
        </div>

        <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
          {[
            { label: 'Y', desc: 'Producción Total', color: 'bg-blue-100 text-blue-700' },
            { label: 'A', desc: 'Tecnología / Eficiencia', color: 'bg-slate-100 text-slate-700' },
            { label: 'K', desc: 'Stock de Capital', color: 'bg-indigo-100 text-indigo-700' },
            { label: 'L', desc: 'Fuerza de Trabajo', color: 'bg-orange-100 text-orange-700' },
            { label: 'α, β', desc: 'Elasticidades', color: 'bg-emerald-100 text-emerald-700' },
          ].map((item, i) => (
            <div key={i} className="p-4 rounded-2xl border border-slate-100 text-center hover:shadow-lg transition-all group">
              <div className={`w-12 h-12 mx-auto mb-3 flex items-center justify-center rounded-xl text-xl font-bold ${item.color} group-hover:scale-110 transition-transform`}>
                {item.label}
              </div>
              <p className="text-xs font-bold text-slate-800 leading-tight">{item.desc}</p>
            </div>
          ))}
        </div>
      </div>
    );

    // --- SECCIÓN 3: SOCIAL ---
    const SectionSocial = () => (
      <div className="animate-in">
        <h2 className="text-3xl font-extrabold mb-4 text-slate-800">El Gran Giro Conceptual</h2>
        <p className="text-lg text-slate-600 mb-8 leading-relaxed">Esta lógica no es exclusiva de las fábricas. Podemos usar la misma estructura matemática para modelar problemas humanos y de políticas públicas.</p>
        
        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 relative">
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 hidden md:block">
            <div className="w-12 h-12 bg-white rounded-full border-4 border-slate-50 flex items-center justify-center shadow-md">
              <TrendingUp className="text-blue-600" size={24} />
            </div>
          </div>

          <div className="space-y-4">
            <div className="p-1 bg-slate-200 rounded-2xl">
              <div className="bg-white p-6 rounded-xl border border-slate-100">
                <h3 className="text-xs uppercase font-black text-slate-400 mb-2 tracking-widest">En la Empresa</h3>
                <p className="text-xl sm:text-2xl font-serif text-slate-800 italic">Prod = f(Máquinas, Horas)</p>
              </div>
            </div>
            <p className="text-sm text-slate-500 text-center italic">"Cómo transformamos insumos físicos en bienes"</p>
          </div>

          <div className="space-y-4">
            <div className="p-1 bg-blue-600 rounded-2xl shadow-lg shadow-blue-100">
              <div className="bg-white p-6 rounded-xl border border-blue-50">
                <h3 className="text-xs uppercase font-black text-blue-400 mb-2 tracking-widest">En la Sociedad</h3>
                <p className="text-xl sm:text-2xl font-serif text-blue-900 italic">Bienestar = f(Educación, Salud, Ingreso)</p>
              </div>
            </div>
            <p className="text-sm text-slate-500 text-center italic">"Cómo las inversiones sociales producen resultados de vida"</p>
          </div>
        </div>

        <div className="mt-12 text-center">
          <p className="text-base sm:text-lg font-bold text-slate-800 px-6 py-4 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 inline-block">
            La función de producción es un modelo universal de causa y efecto.
          </p>
        </div>
      </div>
    );

    // --- SECCIÓN 4: REGRESIÓN ---
    const SectionRegression = () => (
      <div className="animate-in">
        <h2 className="text-3xl font-extrabold mb-4 text-slate-800">Del Modelo a la Regresión</h2>
        <p className="text-slate-600 mb-8 leading-relaxed">Para llevar esto a los datos empíricos, usamos una transformación matemática esencial: <strong>el logaritmo natural</strong>.</p>
        
        <div className="space-y-6">
          <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100 flex flex-col md:flex-row items-center gap-6">
            <div className="flex-1 text-center w-full">
              <p className="text-sm font-bold text-blue-600 mb-2 uppercase tracking-wide">Modelo No Lineal (Potencias)</p>
              <div className="text-xl sm:text-2xl font-serif bg-white p-4 rounded-xl border border-blue-200">
                Y = A · X<sub>1</sub><sup>α</sup> · X<sub>2</sub><sup>β</sup>
              </div>
            </div>
            <div className="text-blue-400 font-bold text-4xl hidden md:block">→</div>
            <div className="flex-1 text-center w-full">
              <p className="text-sm font-bold text-blue-600 mb-2 uppercase tracking-wide">Modelo Lineal (Log-Log)</p>
              <div className="text-xl sm:text-2xl font-serif bg-white p-4 rounded-xl border border-blue-200">
                ln(Y) = ln(A) + α·ln(X<sub>1</sub>) + β·ln(X<sub>2</sub>)
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {[
              { icon: <Calculator />, text: 'Convierte potencias complejas en sumas y multiplicaciones' },
              { icon: <Search />, text: 'Permite estimar parámetros mediante MCO (Mínimos Cuadrados)' },
              { icon: <TrendingUp />, text: 'Los coeficientes estimados se interpretan directamente como ELASTICIDADES' },
            ].map((feat, i) => (
              <div key={i} className="p-5 bg-white border border-slate-200 rounded-2xl flex items-center gap-4 shadow-sm">
                <div className="text-blue-500 shrink-0">{feat.icon}</div>
                <p className="text-sm font-semibold text-slate-700">{feat.text}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    );

    // --- SECCIÓN 5: COEFICIENTES ---
    const SectionCoefficients = () => (
      <div className="animate-in">
        <h2 className="text-3xl font-extrabold mb-6 text-slate-800">Interpretación de Coeficientes</h2>
        
        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div className="bg-emerald-50 p-8 rounded-3xl border border-emerald-100 relative overflow-hidden">
            <div className="absolute -right-8 -bottom-8 opacity-10">
              <TrendingUp size={160} />
            </div>
            <span className="bg-emerald-600 text-white px-3 py-1 rounded-full text-xs font-black mb-4 inline-block tracking-widest uppercase">Signo del Coeficiente</span>
            <div className="flex flex-col gap-6 mt-4">
              <div className="flex items-center gap-4">
                <div className="p-2 bg-white rounded-full text-emerald-600 shadow-sm"><TrendingUp size={20} /></div>
                <p className="font-bold text-slate-800">Positivo (+): <span className="text-emerald-700 font-normal">Cuando la variable explicativa X sube, el resultado Y también aumenta.</span></p>
              </div>
              <div className="flex items-center gap-4">
                <div className="p-2 bg-white rounded-full text-red-600 shadow-sm"><TrendingDown size={20} /></div>
                <p className="font-bold text-slate-800">Negativo (-): <span className="text-red-700 font-normal">Cuando la variable explicativa X sube, el resultado Y disminuye (e.g. pobreza).</span></p>
              </div>
            </div>
          </div>

          <div className="bg-indigo-50 p-8 rounded-3xl border border-indigo-100">
            <span className="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-black mb-4 inline-block tracking-widest uppercase">Magnitud (Elasticidad)</span>
            <p className="text-slate-800 font-medium mt-4 mb-6">En modelos log-log, el valor numérico representa directamente la <strong>variación porcentual relativa</strong>.</p>
            <div className="p-6 bg-white rounded-2xl border border-indigo-200 shadow-sm">
              <p className="text-3xl font-bold text-indigo-900 mb-2 font-mono">α = 0.50</p>
              <div className="flex items-center gap-2 text-indigo-700 font-semibold text-sm">
                <CheckCircle size={18} className="shrink-0" />
                <span>Si X aumenta un 1% → Y aumentará en promedio un 0.50%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    );

    // --- SECCIÓN 6: R-CUADRADO ---
    const SectionRSquared = () => {
      const [fit, setFit] = useState('high');
      
      return (
        <div className="animate-in">
          <h2 className="text-3xl font-extrabold mb-4 text-slate-800">¿Qué tan bien explica el modelo?</h2>
          <p className="text-slate-600 mb-8 leading-relaxed">El <strong>R² (Bondad de ajuste)</strong> indica qué porcentaje de la variación total de la variable dependiente es explicado por las variables del modelo.</p>
          
          <div className="flex gap-3 mb-6">
            <button 
              onClick={() => setFit('high')}
              className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${fit === 'high' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
            >
              R² Alto (0.85)
            </button>
            <button 
              onClick={() => setFit('low')}
              className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${fit === 'low' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
            >
              R² Bajo (0.25)
            </button>
          </div>

          <div className="bg-white border-2 border-slate-100 p-8 rounded-3xl shadow-sm relative h-64 flex items-end justify-between gap-1 overflow-hidden">
            {Array.from({ length: 24 }).map((_, i) => {
              const x = (i / 23) * 100;
              const pseudoRandom = Math.sin(i * 99 + (fit === 'high' ? 12 : 54)) * 0.5;
              const noise = fit === 'high' ? pseudoRandom * 12 : pseudoRandom * 55;
              const y = Math.max(10, Math.min(95, x + noise));
              return (
                <div 
                  key={i} 
                  className={`w-2.5 sm:w-3 rounded-full transition-all duration-500 ${fit === 'high' ? 'bg-blue-500' : 'bg-slate-300'}`} 
                  style={{ height: `${y}%` }} 
                />
              );
            })}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none select-none">
              <p className={`text-5xl sm:text-6xl font-black ${fit === 'high' ? 'text-blue-600/10' : 'text-slate-600/10'} transition-colors`}>
                {fit === 'high' ? 'R² = 0.85' : 'R² = 0.25'}
              </p>
            </div>
          </div>
          
          <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className={`p-4 rounded-xl border ${fit === 'high' ? 'border-blue-100 bg-blue-50' : 'border-slate-100 bg-slate-50'}`}>
              <p className="text-sm font-bold mb-1">Interpretación estadística:</p>
              <p className="text-sm text-slate-700">
                {fit === 'high' 
                  ? "El modelo explica el 85% de la varianza. Las variables seleccionadas tienen un alto poder explicativo." 
                  : "El modelo explica solo el 25%. Faltan variables relevantes o existe alta variabilidad aleatoria no controlada."}
              </p>
            </div>
            <div className="p-4 rounded-xl bg-amber-50 border border-amber-200">
              <p className="text-sm font-bold mb-1 text-amber-800">⚠️ Nota Metodológica:</p>
              <p className="text-sm text-amber-900 italic">Un R² alto demuestra correlación y ajuste estadístico, pero NO prueba por sí solo que exista causalidad real sin un sustento teórico sólido.</p>
            </div>
          </div>
        </div>
      );
    };

    // --- SECCIÓN 7: SIMULADOR ---
    const SectionSimulador = () => {
      const [income, setIncome] = useState(15);
      const [edu, setEdu] = useState(10);
      const [health, setHealth] = useState(12);

      // Parámetros empíricos supuestos para el modelo de pobreza (elasticidades)
      const a = -0.60;
      const b = -0.25;
      const g = -0.10;

      const povertyImpact = useMemo(() => {
        return (income * a) + (edu * b) + (health * g);
      }, [income, edu, health]);

      return (
        <div className="animate-in">
          <div className="flex items-center gap-3 mb-6">
            <div className="p-3 bg-red-100 text-red-600 rounded-2xl"><Calculator /></div>
            <div>
              <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-800">Simulador de Impacto Social</h2>
              <p className="text-sm text-slate-500">Ajusta las políticas para observar la reducción estimada de pobreza</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-6">
              <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                <h4 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-6">Variables Explicativas (Variación %)</h4>
                
                <div className="space-y-6">
                  {[
                    { label: 'Ingreso Familiar Promedio', val: income, set: setIncome, color: 'accent-emerald-500', coef: a },
                    { label: 'Años Promedio de Educación', val: edu, set: setEdu, color: 'accent-blue-500', coef: b },
                    { label: 'Acceso a Servicios de Salud', val: health, set: setHealth, color: 'accent-indigo-500', coef: g },
                  ].map((row, i) => (
                    <div key={i}>
                      <div className="flex justify-between text-sm font-bold mb-2">
                        <span className="text-slate-700">{row.label}</span>
                        <span className="text-slate-900 font-mono">+{row.val}%</span>
                      </div>
                      <input 
                        type="range" 
                        min="0" max="100" 
                        value={row.val} 
                        onChange={(e) => row.set(parseInt(e.target.value))}
                        className={`w-full h-2 rounded-lg cursor-pointer ${row.color}`}
                      />
                      <p className="text-[11px] text-slate-500 mt-1 font-mono">Coeficiente (Elasticidad): {row.coef}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex flex-col">
              <div className="bg-slate-900 text-white p-8 rounded-3xl shadow-xl flex-grow flex flex-col items-center justify-center text-center relative overflow-hidden">
                <div className="absolute top-0 right-0 p-4 opacity-10"><TrendingDown size={120} /></div>
                
                <p className="text-slate-400 uppercase text-xs font-black tracking-widest mb-2">Reducción Estimada de Pobreza</p>
                <div className="text-5xl sm:text-6xl font-black text-red-400 mb-3 font-mono">
                  {povertyImpact.toFixed(2)}%
                </div>
                <p className="text-slate-300 text-xs sm:text-sm max-w-[280px]">Bajo este modelo econométrico, la pobreza disminuiría en este porcentaje estimado.</p>
                
                <div className="mt-6 pt-6 border-t border-slate-800 w-full text-left space-y-2">
                  <div className="flex justify-between text-xs font-bold">
                    <span className="text-slate-400">Ecuación estimada:</span>
                    <span className="text-slate-300 font-serif italic text-right">ln(P) = C - 0.60·ln(I) - 0.25·ln(E) - 0.10·ln(S)</span>
                  </div>
                  <div className="flex justify-between text-xs font-bold">
                    <span className="text-slate-400">R² Ajustado:</span>
                    <span className="text-emerald-400 font-mono">0.78 (78% de varianza explicada)</span>
                  </div>
                </div>
              </div>
              
              <div className="mt-4 p-4 bg-white border border-slate-200 rounded-2xl flex items-start gap-3 shadow-sm">
                <Info className="text-blue-500 shrink-0 mt-0.5" size={16} />
                <p className="text-xs text-slate-600">Observa cómo el <strong>Ingreso</strong> genera el mayor impacto relativo al tener la elasticidad más pronunciada (-0.60).</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- APLICACIÓN PRINCIPAL ---
    const App = () => {
      const [activeSection, setActiveSection] = useState(0);

      const sections = [
        { id: 'inicio', title: 'Idea Inicial' },
        { id: 'clasica', title: 'Función Clásica' },
        { id: 'giro', title: 'Giro Social' },
        { id: 'regresion', title: 'De Modelo a Datos' },
        { id: 'coeficientes', title: 'Coeficientes' },
        { id: 'r2', title: 'Ajuste (R²)' },
        { id: 'simulador', title: 'Simulador' },
      ];

      const nextSection = () => setActiveSection((prev) => Math.min(prev + 1, sections.length - 1));
      const prevSection = () => setActiveSection((prev) => Math.max(prev - 1, 0));

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-100 flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <a 
                  href="../../index.html" 
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition border border-slate-300"
                >
                  ← Repositorio Docente
                </a>
                <div className="hidden sm:block">
                  <h1 className="text-lg font-bold text-blue-900 uppercase tracking-tight">La Función de Producción</h1>
                  <p className="text-xs text-slate-500 font-medium">Matemática Básica para Ciencias Políticas 1</p>
                </div>
              </div>

              <nav className="flex gap-1 overflow-x-auto max-w-full py-1">
                {sections.map((sec, idx) => (
                  <button
                    key={sec.id}
                    onClick={() => setActiveSection(idx)}
                    className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-all whitespace-nowrap ${
                      activeSection === idx 
                        ? 'bg-blue-600 text-white shadow-md' 
                        : 'text-slate-500 hover:bg-slate-100'
                    }`}
                  >
                    {idx + 1}. {sec.title}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 w-full">
            <div className="bg-white rounded-3xl shadow-xl border border-slate-200 min-h-[580px] flex flex-col overflow-hidden">
              <div className="flex-grow p-6 sm:p-10 md:p-12">
                {activeSection === 0 && <SectionIntro />}
                {activeSection === 1 && <SectionClassic />}
                {activeSection === 2 && <SectionSocial />}
                {activeSection === 3 && <SectionRegression />}
                {activeSection === 4 && <SectionCoefficients />}
                {activeSection === 5 && <SectionRSquared />}
                {activeSection === 6 && <SectionSimulador />}
              </div>

              {/* Footer Navigation */}
              <div className="p-4 sm:p-6 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-4">
                <button
                  onClick={prevSection}
                  disabled={activeSection === 0}
                  className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold transition-all text-sm ${
                    activeSection === 0 ? 'opacity-0 pointer-events-none' : 'text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  <ChevronLeft size={18} /> Anterior
                </button>
                
                <div className="flex gap-1.5">
                  {sections.map((_, idx) => (
                    <div 
                      key={idx} 
                      className={`h-2 rounded-full transition-all duration-300 ${activeSection === idx ? 'w-6 bg-blue-600' : 'w-2 bg-slate-300'}`} 
                    />
                  ))}
                </div>

                <button
                  onClick={nextSection}
                  disabled={activeSection === sections.length - 1}
                  className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold transition-all text-sm ${
                    activeSection === sections.length - 1 
                      ? 'bg-emerald-100 text-emerald-700 cursor-default' 
                      : 'bg-blue-600 text-white hover:bg-blue-700 shadow-md shadow-blue-200'
                  }`}
                >
                  {activeSection === sections.length - 1 ? '¡Finalizado!' : 'Siguiente'} <ChevronRight size={18} />
                </button>
              </div>
            </div>
          </main>

          <footer className="text-center text-xs text-slate-400 py-4 border-t border-slate-200">
            Repositorio Docente · Matemática Básica para Ciencias Políticas 1
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
