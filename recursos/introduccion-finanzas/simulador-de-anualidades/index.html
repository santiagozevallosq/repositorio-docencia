<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Anualidades Vencidas y Anticipadas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <!-- Botón superior Volver al Repositorio -->
  <div class="max-w-4xl mx-auto px-4 pt-4 flex justify-between items-center">
    <a href="../../../index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:text-indigo-600 transition text-xs font-semibold shadow-xs">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Repositorio Docente
    </a>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;


    const IconBase = ({ children, className = "w-5 h-5", size = 20, ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );
    const Wallet = (p) => <IconBase {...p}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></IconBase>;
    const Percent = (p) => <IconBase {...p}><line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></IconBase>;
    const Calendar = (p) => <IconBase {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>;
    const RefreshCcw = (p) => <IconBase {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></IconBase>;
    const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></IconBase>;
    const Lightbulb = (p) => <IconBase {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconBase>;
    const ArrowRight = (p) => <IconBase {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
    const Clock = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
    const Target = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconBase>;
    const Rocket = (p) => <IconBase {...p}><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></IconBase>;
    const BookOpen = (p) => <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
    const TrendingUp = (p) => <IconBase {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></IconBase>;




const App = () => {
  // Estados principales de la herramienta
  const [cuota, setCuota] = useState(200);
  const [tasa, setTasa] = useState(2); // porcentaje
  const [periodos, setPeriodos] = useState(12);
  const [tipoAnualidad, setTipoAnualidad] = useState('vencida'); // 'vencida' | 'anticipada'
  const [tipoCalculo, setTipoCalculo] = useState('vf'); // 'vf' (Valor Futuro) | 'vp' (Valor Presente)

  // Cálculos matemáticos
  const r = tasa / 100;
  
  const calcularValores = useMemo(() => {
    // Fórmulas base para anualidad vencida
    const vfVencida = cuota * ((Math.pow(1 + r, periodos) - 1) / r);
    const vpVencida = cuota * ((1 - Math.pow(1 + r, -periodos)) / r);
    
    // Fórmulas para anualidad anticipada (se multiplica por 1+r)
    const vfAnticipada = vfVencida * (1 + r);
    const vpAnticipada = vpVencida * (1 + r);

    // Selección del resultado actual
    let resultado = 0;
    let resultadoAlternativo = 0; // Para el comparador

    if (tipoCalculo === 'vf') {
      resultado = tipoAnualidad === 'vencida' ? vfVencida : vfAnticipada;
      resultadoAlternativo = tipoAnualidad === 'vencida' ? vfAnticipada : vfVencida;
    } else {
      resultado = tipoAnualidad === 'vencida' ? vpVencida : vpAnticipada;
      resultadoAlternativo = tipoAnualidad === 'vencida' ? vpAnticipada : vpVencida;
    }

    return { resultado, resultadoAlternativo, vfVencida, vpVencida, vfAnticipada, vpAnticipada };
  }, [cuota, r, periodos, tipoAnualidad, tipoCalculo]);

  const { resultado, resultadoAlternativo } = calcularValores;

  // Generación de datos para la tabla paso a paso
  const datosTabla = useMemo(() => {
    let datos = [];
    let acumulado = 0;

    for (let i = 1; i <= periodos; i++) {
      if (tipoCalculo === 'vf') {
        if (tipoAnualidad === 'vencida') {
          // Vencida: interés sobre lo anterior, luego se suma el depósito
          const interes = acumulado * r;
          acumulado = acumulado + interes + cuota;
          datos.push({ periodo: i, transaccion: cuota, interes, balance: acumulado });
        } else {
          // Anticipada: depósito al inicio, interés sobre el total (acumulado + depósito)
          const interes = (acumulado + cuota) * r;
          acumulado = acumulado + cuota + interes;
          datos.push({ periodo: i, transaccion: cuota, interes, balance: acumulado });
        }
      } else {
        // Valor Presente
        if (tipoAnualidad === 'vencida') {
          // El pago se hace al final del periodo
          const factor = Math.pow(1 + r, -i);
          const vpPago = cuota * factor;
          acumulado += vpPago;
          datos.push({ periodo: i, transaccion: cuota, factor, balance: vpPago });
        } else {
          // Anticipada: el pago se hace al inicio (el periodo 1 no tiene descuento)
          const k = i - 1; 
          const factor = Math.pow(1 + r, -k);
          const vpPago = cuota * factor;
          acumulado += vpPago;
          datos.push({ periodo: i, transaccion: cuota, factor, balance: vpPago });
        }
      }
    }
    return datos;
  }, [cuota, r, periodos, tipoAnualidad, tipoCalculo]);

  // Formateador de moneda
  const formatoDinero = (valor) => {
    return new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(valor);
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">
      {/* 1. Encabezado Atractivo */}
      <header className="bg-indigo-600 text-white py-10 px-6 shadow-md rounded-b-[2.5rem] mb-8">
        <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
          <div className="text-center md:text-left">
            <h1 className="text-4xl font-extrabold tracking-tight mb-2 flex items-center justify-center md:justify-start gap-3">
              <Rocket className="w-8 h-8 text-yellow-300" />
              Explora las anualidades
            </h1>
            <p className="text-indigo-100 text-lg max-w-2xl">
              Juega con tus pagos, cambia los valores y descubre cómo crece tu dinero de forma visual e intuitiva.
            </p>
          </div>
          <div className="bg-white/10 p-4 rounded-2xl backdrop-blur-sm border border-white/20">
             <Target className="w-12 h-12 text-yellow-300 mx-auto" />
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 md:px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        {/* COLUMNA IZQUIERDA: Controles e Interacción (5 columnas) */}
        <div className="lg:col-span-4 space-y-6">
          
          {/* 2. Panel de Entradas Interactivas */}
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
            <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
              <RefreshCcw className="w-5 h-5 text-indigo-500" />
              Configura tu escenario
            </h2>

            {/* Cuota */}
            <div className="mb-6">
              <div className="flex justify-between items-end mb-2">
                <label className="font-semibold text-slate-700 flex items-center gap-2">
                  <Wallet className="w-4 h-4 text-emerald-500" /> Cuota o renta
                </label>
                <div className="text-xs text-slate-500 flex items-center gap-1 group relative cursor-help">
                  <Info className="w-3 h-3" /> ¿Qué es?
                  <div className="absolute bottom-full right-0 mb-2 w-48 bg-slate-800 text-white text-xs p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10">
                    Es lo que pagas, depositas o ahorras en cada periodo.
                  </div>
                </div>
              </div>
              <div className="flex gap-4 items-center">
                <span className="text-slate-500 font-medium">S/</span>
                <input 
                  type="number" 
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                  value={cuota} onChange={(e) => setCuota(Number(e.target.value))}
                />
              </div>
              <input type="range" min="10" max="2000" step="10" value={cuota} onChange={(e) => setCuota(Number(e.target.value))} className="w-full mt-3 accent-indigo-500" />
            </div>

            {/* Tasa */}
            <div className="mb-6">
              <div className="flex justify-between items-end mb-2">
                <label className="font-semibold text-slate-700 flex items-center gap-2">
                  <Percent className="w-4 h-4 text-amber-500" /> Tasa de interés
                </label>
                <div className="text-xs text-slate-500 flex items-center gap-1 group relative cursor-help">
                  <Info className="w-3 h-3" /> ¿Qué es?
                  <div className="absolute bottom-full right-0 mb-2 w-48 bg-slate-800 text-white text-xs p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10">
                    El porcentaje de interés que aplica en cada periodo.
                  </div>
                </div>
              </div>
              <div className="flex gap-4 items-center">
                <input 
                  type="number" 
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                  value={tasa} onChange={(e) => setTasa(Number(e.target.value))}
                />
                <span className="text-slate-500 font-medium">%</span>
              </div>
              <input type="range" min="1" max="20" step="0.5" value={tasa} onChange={(e) => setTasa(Number(e.target.value))} className="w-full mt-3 accent-indigo-500" />
            </div>

            {/* Periodos */}
            <div className="mb-6">
              <div className="flex justify-between items-end mb-2">
                <label className="font-semibold text-slate-700 flex items-center gap-2">
                  <Calendar className="w-4 h-4 text-blue-500" /> Número de periodos
                </label>
                <div className="text-xs text-slate-500 flex items-center gap-1 group relative cursor-help">
                  <Info className="w-3 h-3" /> ¿Qué es?
                  <div className="absolute bottom-full right-0 mb-2 w-48 bg-slate-800 text-white text-xs p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10">
                    La cantidad total de pagos o depósitos que harás.
                  </div>
                </div>
              </div>
              <div className="flex gap-4 items-center">
                <input 
                  type="number" 
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                  value={periodos} onChange={(e) => setPeriodos(Number(e.target.value))}
                />
              </div>
              <input type="range" min="2" max="36" step="1" value={periodos} onChange={(e) => setPeriodos(Number(e.target.value))} className="w-full mt-3 accent-indigo-500" />
            </div>

            {/* Tipos: Botones de selección múltiple */}
            <div className="space-y-4">
              <div>
                <p className="text-sm font-semibold text-slate-500 mb-2 uppercase tracking-wide">Tipo de anualidad</p>
                <div className="flex rounded-xl overflow-hidden border border-indigo-100 p-1 bg-slate-50">
                  <button 
                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${tipoAnualidad === 'vencida' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}
                    onClick={() => setTipoAnualidad('vencida')}
                  >
                    Vencida (Fin)
                  </button>
                  <button 
                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${tipoAnualidad === 'anticipada' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}
                    onClick={() => setTipoAnualidad('anticipada')}
                  >
                    Anticipada (Inicio)
                  </button>
                </div>
              </div>

              <div>
                <p className="text-sm font-semibold text-slate-500 mb-2 uppercase tracking-wide">¿Qué deseas calcular?</p>
                <div className="flex rounded-xl overflow-hidden border border-indigo-100 p-1 bg-slate-50">
                  <button 
                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${tipoCalculo === 'vf' ? 'bg-emerald-500 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}
                    onClick={() => setTipoCalculo('vf')}
                  >
                    Valor Futuro
                  </button>
                  <button 
                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${tipoCalculo === 'vp' ? 'bg-emerald-500 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}
                    onClick={() => setTipoCalculo('vp')}
                  >
                    Valor Presente
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* 9. Mini modo exploración (Retos) */}
          <div className="bg-indigo-50 border border-indigo-100 rounded-3xl p-5">
            <h3 className="font-bold text-indigo-800 flex items-center gap-2 mb-3">
              <Lightbulb className="w-5 h-5 text-amber-500" />
              Retos para explorar
            </h3>
            <ul className="space-y-3">
              <li className="text-sm text-indigo-700 bg-white p-3 rounded-xl shadow-sm border border-indigo-100 flex gap-2 items-start">
                <span className="text-lg">🧐</span>
                <span>¿Qué pasa con el resultado si pasas de <strong>Vencida</strong> a <strong>Anticipada</strong>?</span>
              </li>
              <li className="text-sm text-indigo-700 bg-white p-3 rounded-xl shadow-sm border border-indigo-100 flex gap-2 items-start">
                <span className="text-lg">🚀</span>
                <span>Sube la tasa de interés al doble. ¿El valor también se duplica o crece más?</span>
              </li>
            </ul>
          </div>
        </div>

        {/* COLUMNA DERECHA: Resultados, Visualización y Tabla (8 columnas) */}
        <div className="lg:col-span-8 space-y-6">
          
          {/* 3. Resultado principal */}
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div className={`p-8 text-center text-white ${tipoCalculo === 'vf' ? 'bg-emerald-500' : 'bg-blue-500'}`}>
              <h2 className="text-emerald-50 text-lg font-medium mb-1 opacity-90">
                {tipoCalculo === 'vf' ? 'Tu Valor Futuro es de' : 'El Valor Presente equivale a'}
              </h2>
              <div className="text-5xl font-extrabold tracking-tight mb-3 drop-shadow-sm">
                {formatoDinero(resultado)}
              </div>
              <p className="text-sm bg-white/20 inline-block px-4 py-2 rounded-full backdrop-blur-sm">
                {tipoCalculo === 'vf' 
                  ? '🎯 Este es el monto acumulado al final de todos los periodos.' 
                  : '⏳ Este es el valor equivalente hoy de todos esos pagos futuros.'}
              </p>
            </div>

            {/* 7. Comparación visual entre escenarios */}
            <div className="bg-slate-50 p-4 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between px-8 text-sm">
              <div className="flex items-center gap-3 text-slate-600">
                <Info className="w-5 h-5 text-indigo-400" />
                <span>
                  Si fuera una anualidad <strong className="text-indigo-600">{tipoAnualidad === 'vencida' ? 'Anticipada' : 'Vencida'}</strong>, 
                  el valor sería:
                </span>
              </div>
              <span className="font-bold text-slate-800 text-base bg-white px-3 py-1 rounded-lg border border-slate-200 mt-2 sm:mt-0">
                {formatoDinero(resultadoAlternativo)}
              </span>
            </div>

            {/* 8. Mensajes pedagógicos automáticos */}
            <div className="px-8 py-5">
              <div className="flex gap-3 items-start bg-indigo-50 text-indigo-800 p-4 rounded-2xl border border-indigo-100">
                <span className="text-2xl mt-[-2px]">💡</span>
                <p className="text-sm font-medium leading-relaxed">
                  {tipoAnualidad === 'anticipada' 
                    ? "En la anualidad anticipada el valor es mayor porque pagas al inicio del periodo, dando a tu dinero más tiempo para generar intereses." 
                    : "En la anualidad vencida, los pagos se realizan al final de cada periodo. Es el escenario más común para préstamos o créditos."}
                  {periodos >= 24 && " ¡Con tantos periodos, notarás que el interés compuesto hace que la curva de crecimiento se dispare!"}
                </p>
              </div>
            </div>
          </div>

          {/* 5. Línea de tiempo visual */}
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
              <Clock className="w-5 h-5 text-indigo-500" />
              Línea de tiempo del dinero
            </h3>
            <p className="text-sm text-slate-500 mb-6">
              Observa <strong className="text-indigo-600">cuándo</strong> ocurre el pago en cada periodo (rectángulos). 
              {tipoAnualidad === 'vencida' ? ' Como es Vencida, el pago se hace al FINAL del periodo.' : ' Como es Anticipada, el pago se hace al INICIO del periodo.'}
            </p>

            <div className="flex overflow-x-auto pb-6 pt-2 hide-scrollbar items-center px-2">
              {Array.from({ length: Math.min(periodos, 12) }).map((_, i) => (
                <div key={i} className="flex flex-col items-center flex-shrink-0 relative">
                  {/* Period Block */}
                  <div className="w-24 h-16 bg-slate-100 border border-slate-200 rounded-lg flex items-center justify-center relative mx-1">
                    <span className="text-slate-400 font-bold text-lg opacity-30">P{i + 1}</span>
                    
                    {/* Payment Indicator Indicator */}
                    <div className={`absolute -top-3 flex flex-col items-center ${tipoAnualidad === 'vencida' ? '-right-3' : '-left-3'}`}>
                      <div className="bg-emerald-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-md z-10 flex items-center gap-1">
                        <Wallet className="w-3 h-3" /> {cuota}
                      </div>
                      <div className="w-1 h-4 bg-emerald-500"></div>
                    </div>
                  </div>
                  {/* Time arrow */}
                  <div className="h-1 w-full bg-slate-200 mt-4 relative">
                     {i === Math.min(periodos, 12) - 1 && periodos > 12 && (
                        <div className="absolute -right-6 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-bold bg-white px-2">... {periodos}</div>
                     )}
                  </div>
                  <div className="text-xs text-slate-500 mt-2 font-medium">
                    {tipoAnualidad === 'vencida' ? `Fin P${i+1}` : `Inicio P${i+1}`}
                  </div>
                </div>
              ))}
              {/* Arrow End */}
              <div className="ml-2 mt-4 text-slate-300">
                <ArrowRight className="w-6 h-6" />
              </div>
            </div>
            {periodos > 12 && (
              <p className="text-xs text-center text-slate-400 italic mt-2">* Mostrando los primeros 12 periodos por espacio.</p>
            )}
          </div>

          {/* 4. Fórmula mostrada de forma amigable */}
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
            <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
              <BookOpen className="w-5 h-5 text-indigo-500" />
              La fórmula detrás de la magia
            </h3>
            
            <div className="flex flex-col md:flex-row items-center justify-center gap-8 bg-slate-50 p-6 rounded-2xl border border-slate-100">
              
              {/* Fórmula Teórica */}
              <div className="flex items-center text-lg font-serif text-slate-700">
                <span className="font-bold mr-3">{tipoCalculo === 'vf' ? 'VF' : 'VP'} =</span>
                <span className="italic mr-2">R</span>
                <span className="mx-2">×</span>
                <div className="flex flex-col items-center">
                  <span className="border-b border-slate-400 pb-1 px-2">
                    {tipoCalculo === 'vf' ? '(1 + i)ⁿ - 1' : '1 - (1 + i)⁻ⁿ'}
                  </span>
                  <span className="pt-1 italic">i</span>
                </div>
                {tipoAnualidad === 'anticipada' && (
                  <span className="ml-3 text-indigo-600 font-bold">× (1 + i)</span>
                )}
              </div>

              <div className="text-slate-300 hidden md:block">
                <ArrowRight className="w-8 h-8" />
              </div>

              {/* Reemplazo Numérico */}
              <div className="flex items-center text-lg font-mono text-emerald-700 bg-emerald-50 px-4 py-3 rounded-xl border border-emerald-100">
                <span className="font-bold mr-3">{tipoCalculo === 'vf' ? 'VF' : 'VP'} =</span>
                <span className="mr-2">{cuota}</span>
                <span className="mx-2">×</span>
                <div className="flex flex-col items-center">
                  <span className="border-b border-emerald-400 pb-1 px-2">
                    {tipoCalculo === 'vf' ? `(1 + ${r})` : `1 - (1 + ${r})`}
                    <sup>{tipoCalculo === 'vf' ? periodos : `-${periodos}`}</sup>
                    {tipoCalculo === 'vf' ? ' - 1' : ''}
                  </span>
                  <span className="pt-1">{r}</span>
                </div>
                {tipoAnualidad === 'anticipada' && (
                  <span className="ml-3 font-bold">× (1 + {r})</span>
                )}
              </div>

            </div>
          </div>

          {/* 6. Tabla periodo a periodo */}
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 overflow-hidden">
            <h3 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
              <TrendingUp className="w-5 h-5 text-indigo-500" />
              Evolución periodo a periodo
            </h3>
            <p className="text-sm text-slate-500 mb-4">
              Mira cómo cambia el dinero en cada paso.
            </p>
            
            <div className="overflow-x-auto max-h-80 border border-slate-200 rounded-xl hide-scrollbar">
              <table className="w-full text-left border-collapse text-sm">
                <thead className="bg-slate-100 sticky top-0 z-10 shadow-sm">
                  <tr>
                    <th className="p-3 text-slate-600 font-semibold border-b border-slate-200">Periodo</th>
                    <th className="p-3 text-slate-600 font-semibold border-b border-slate-200 text-right">
                      {tipoCalculo === 'vf' ? 'Depósito / Cuota' : 'Pago Futuro'}
                    </th>
                    <th className="p-3 text-slate-600 font-semibold border-b border-slate-200 text-right">
                      {tipoCalculo === 'vf' ? 'Interés Ganado' : 'Factor de Descuento'}
                    </th>
                    <th className="p-3 text-slate-800 font-bold border-b border-slate-200 text-right">
                      {tipoCalculo === 'vf' ? 'Monto Acumulado' : 'Valor Presente (Suma)'}
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {datosTabla.map((fila, index) => (
                    <tr key={index} className="hover:bg-slate-50 transition-colors">
                      <td className="p-3 text-slate-500 font-medium text-center">{fila.periodo}</td>
                      <td className="p-3 text-slate-700 text-right">{formatoDinero(fila.transaccion)}</td>
                      <td className="p-3 text-slate-500 text-right">
                        {tipoCalculo === 'vf' 
                          ? `+${formatoDinero(fila.interes)}` 
                          : fila.factor.toFixed(4)}
                      </td>
                      <td className="p-3 text-indigo-700 font-bold text-right bg-indigo-50/30">
                        {formatoDinero(fila.balance)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </main>

      {/* Mensaje final o cierre */}
      <footer className="max-w-4xl mx-auto mt-12 mb-8 px-6 text-center">
        <div className="bg-gradient-to-r from-indigo-100 to-blue-100 p-6 rounded-3xl border border-indigo-200">
          <p className="text-indigo-800 text-sm font-medium leading-relaxed">
            🎓 <strong>Las anualidades</strong> te ayudan a entender cómo una serie de pagos iguales puede convertirse en un gran valor futuro (ahorro) o en un valor presente (préstamos). Explorar estas variables te permite ver el verdadero poder del tiempo y la tasa de interés sobre tu dinero. ¡Sigue experimentando!
          </p>
        </div>
      </footer>

      {/* CSS extra para ocultar scrollbars nativas pero permitir scroll */}
      <style dangerouslySetInnerHTML={{__html: `
        .hide-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .hide-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
      `}} />
    </div>
  );
};



    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
